<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VšĮ Karate Ateitis — tradicinio karate-do klubas Vilniuje. Treniruotės vaikams, jaunimui ir suaugusiems. Pirmos dvi treniruotės nemokamos.">
<title>Karateka — VšĮ Karate Ateitis</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#811517">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    color:#F7F4EC;
    overflow:hidden;
  }
  .stage{
    position:relative; height:100vh; width:100vw;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:116px 0 40px; overflow-y:auto;
  }
  /* text + buttons travel together, buttons sit a clear gap below the copy */
  .center-block{
    position:relative; z-index:2; width:100%;
    display:flex; flex-direction:column; align-items:center;
    margin:auto 0;   /* centres when there is room, never clips the top when there is not */
  }
  .bg{position:absolute; inset:0; z-index:0;}
  .bg img{width:100%; height:100%; object-fit:cover; object-position:50% 35%;}
  .bg::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,12,9,0.55) 0%, rgba(15,12,9,0.72) 55%, rgba(15,12,9,0.92) 100%);
  }
  .top{position:absolute; top:36px; left:0; right:0; z-index:2; text-align:center;}
  .top img{height:64px; margin:0 auto;}
  .middle{position:relative; z-index:2; text-align:center; padding:0 24px; max-width:720px;}
  .middle .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:0.78rem; letter-spacing:0.18em;
    text-transform:uppercase; color:#5FD3AC; font-weight:700; margin-bottom:18px;
    text-shadow:0 1px 6px rgba(0,0,0,0.45);
  }
  .middle h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.01em;
    font-size:clamp(1.9rem, 4.4vw, 3rem); line-height:1.15; margin-bottom:14px;
  }
  .middle p{color:#D8D2C2; font-size:1.05rem; max-width:520px; margin:0 auto;}
  .choices{
    position:relative; z-index:2; width:100%; max-width:980px; padding:0 24px;
    margin-top:clamp(38px,6.5vh,72px);
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px;
  }
  .choice{
    display:flex; align-items:center; justify-content:center;
    padding:26px 20px; border-radius:16px;
    background:rgba(247,244,236,0.08);
    border:1.5px solid rgba(247,244,236,0.22);
    backdrop-filter:blur(10px);
    text-decoration:none !important;
    transition:transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .choice:hover{
    transform:translateY(-6px);
    background:rgba(168,92,126,0.85);
    border-color:rgba(168,92,126,0.9);
  }
  .choice .label{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; color:#F7F4EC !important; text-decoration:none;}

  .login-btn{
    position:absolute; top:44px; right:40px; z-index:3;
    padding:11px 22px; border-radius:10px;
    background:rgba(247,244,236,0.08); border:1.5px solid rgba(247,244,236,0.35);
    backdrop-filter:blur(10px);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:0.9rem;
    color:#F7F4EC; text-decoration:none;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .login-btn:hover{background:rgba(168,92,126,0.85); border-color:rgba(168,92,126,0.9);}

  .scroll-hint{
    position:relative; z-index:2; padding-bottom:20px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.12em;
    color:#9C9484; text-transform:uppercase;
  }

  @media(max-width:720px){
    .choices{grid-template-columns:1fr; gap:14px; margin-top:clamp(28px,4.5vh,44px);}
    .stage{height:auto; min-height:100vh; padding:112px 0 40px;}
    body{overflow:auto;}
    .login-btn{top:16px; right:16px; padding:8px 14px; font-size:0.8rem;}
    .top{top:56px;}
    .stage{padding-top:136px;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="bg"><img src="Page1HeroBg.jpg" alt="Karate treniruotė"></div>

  <a class="login-btn" href="prisijungti.php">Prisijungti</a>

  <div class="top">
    <img src="LogoWhite.png" alt="Karateka logotipas">
  </div>

  <div class="center-block">
  <div class="middle">
    <div class="eyebrow">VšĮ KARATE ATEITIS · VILNIUS</div>
    <h1>Kam ieškote treniruočių?</h1>
    <p>Pasirinkite grupę žemiau — nukelsime jus tiesiai prie reikiamos informacijos: kainų, vietos ir tvarkaraščio.</p>
  </div>

  <div class="choices">
    <a class="choice" href="page1.html#vaikams">
      <div class="label">Vaikams</div>
    </a>
    <a class="choice" href="page1.html#jaunimui">
      <div class="label">Jaunimui</div>
    </a>
    <a class="choice" href="page1.html#suaugusiems">
      <div class="label">Suaugusiems</div>
    </a>
  </div>
  </div>
</div>

</body>
</html>
