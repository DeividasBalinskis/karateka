# Ekrano nuotraukos (v2.15): pasirinktos šakos svetainė su testų duomenimis, nuotraukos 375 / 1440 px - priedas „ekranai“.
# Sesijos pabaigai (CLAUDE.md: nuotraukos prieš ir po) - be Deivido naršyklės. Actions → „Ekrano nuotraukos“ → Run workflow.
name: Ekrano nuotraukos

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Kurie nuotraukų failai (pvz. ekranai/budo-sekretoriatas.spec.js); tuščia - visi'
        required: false
        default: ''

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          TZ: Europe/Vilnius
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: karateka
      TZ: Europe/Vilnius
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd, zlib
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Konfigūracija ir testų duomenų bazė
        run: |
          cp tests/setup/config.ci.php public_html/config.php
          bash tests/setup/reset-db.sh

      - name: Svetainė (PHP serveris)
        run: |
          php -S 127.0.0.1:8088 -t public_html > /tmp/php-server.log 2>&1 &
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8088/

      - name: Nuotraukos
        working-directory: tests
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config=ekranai.config.js $SPEC

      - name: Priedas „ekranai“
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekranai
          path: |
            tests/ekranai-out
            /tmp/php-server.log
          retention-days: 7
